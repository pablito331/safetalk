name: Build and Release SafeTalk APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${{ github.run_number }}"
          fi
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          # versionCode always uses the run number: guaranteed monotonic increase,
          # so Android always allows installing the new APK over the old one.
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (code ${{ github.run_number }})"

      - name: Decode Signing Keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "🔐 Segredo de assinatura encontrado - build release assinado"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Sem secrets de assinatura - gerando APK de debug"
          fi

      - name: Build Release APK (signed)
        if: ${{ steps.keystore.outputs.available == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            -PappVersionCode=${{ steps.version.outputs.version_code }}

      - name: Build Debug APK (fallback)
        if: ${{ steps.keystore.outputs.available != 'true' }}
        run: |
          ./gradlew assembleDebug \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            -PappVersionCode=${{ steps.version.outputs.version_code }}

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apk
          APK=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          cp "$APK" release_apk/safetalk.apk
          echo "APK final: $(ls -lh release_apk/safetalk.apk)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version_name) }}
          name: ${{ format('SafeTalk Release v{0}', steps.version.outputs.version_name) }}
          body: |
            🎉 Nova versão do SafeTalk compilada automaticamente!

            - Download direto do APK atualizado abaixo.
            - Atualização automática compatível no aplicativo.
          files: |
            release_apk/safetalk.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
